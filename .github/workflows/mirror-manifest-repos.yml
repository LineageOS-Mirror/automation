name: Mirror LineageOS repos from manifest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no repo creation/push, just print plan)"
        required: false
        default: "false"

env:
  # ---- EDIT IF NEEDED ----
  TARGET_ORG: LineageOS-Mirror
  MANIFEST_REPO: LineageOS-Mirror/android
  UPSTREAM_FALLBACK: https://github.com/LineageOS
  # -------------------------
  BRANCH: lineage-24.0
  MANIFEST_FILE: default.xml

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.GH_PAT }}
          path: manifest

      - name: Parse default.xml
        id: parse
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          import json, os

          tree = ET.parse(f"manifest/{os.environ['MANIFEST_FILE']}")
          root = tree.getroot()

          remotes = {}
          default_remote = None
          default_revision = os.environ["BRANCH"]

          for r in root.findall("remote"):
              remotes[r.get("name")] = r.get("fetch")

          d = root.find("default")
          if d is not None:
              default_remote = d.get("remote")

          projects = []
          for p in root.findall("project"):
              name = p.get("name")
              if not name or not name.startswith("LineageOS/"):
                  continue
              path = p.get("path") or name
              remote_name = p.get("remote") or default_remote
              fetch = remotes.get(remote_name, "")
              revision = p.get("revision") or default_revision
              if fetch.startswith("http"):
                  clone_url = f"{fetch.rstrip('/')}/{name}.git"
              else:
                  clone_url = f"{os.environ['UPSTREAM_FALLBACK'].rstrip('/')}/{name}.git"
              projects.append({
                  "name": name,
                  "path": path,
                  "clone_url": clone_url,
                  "revision": revision,
              })

          with open("projects.json", "w") as f:
              json.dump(projects, f, indent=2)

          print(f"Parsed {len(projects)} projects")
          PYEOF

      - name: Fork each project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          jq -c '.[]' projects.json | while read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            REVISION=$(echo "$row" | jq -r '.revision')

            OWNER=$(dirname "$NAME")
            REPO=$(basename "$NAME")

            echo "== forking $OWNER/$REPO -> $TARGET_ORG/$REPO (default branch: $REVISION) =="

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would fork $OWNER/$REPO into org $TARGET_ORG, then set default branch to $REVISION"
              continue
            fi

            if gh repo view "$TARGET_ORG/$REPO" >/dev/null 2>&1; then
              echo "$TARGET_ORG/$REPO already exists, skipping fork"
            else
              gh api -X POST "repos/$OWNER/$REPO/forks" -f organization="$TARGET_ORG" >/dev/null
              echo "Fork requested for $OWNER/$REPO, waiting for it to become available..."
              for i in $(seq 1 30); do
                if gh repo view "$TARGET_ORG/$REPO" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
            fi

            gh api -X PATCH "repos/$TARGET_ORG/$REPO" -f default_branch="$REVISION" >/dev/null || \
              echo "WARN: could not set default branch to $REVISION for $REPO (does that branch exist upstream?)"

          done
